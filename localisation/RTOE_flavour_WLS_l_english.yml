l_english:
 RTOE_flavour_WLS.1.t: "The utter ruin of the Welsh"
 RTOE_flavour_WLS.1.d: "in 1442, Gwynedd has suffered a decisive defeat at the hands of Normandy. After a hard-fought war, our armies were overwhelmed and our defenses collapsed. With our leaders either captured or in retreat, the kingdom is no longer able to continue the fight. Normandy now demands our submission in exchange for peace."
 RTOE_flavour_WLS.1.a: "We're done fighting for now."
 RTOE_flavour_WLS.1.a.tooltip: "We will ask §YNormandy§! to become their §YFeudal Vassal§!.\nIn return, we will receive all the provinces in §YNorth Wales§! and §YDyfed§! areas from our new overlord."
 RTOE_flavour_WLS.1.b: "There's life in us yet!"
 RTOE_flavour_WLS.1.b.tooltip: "§MCurse you, Saxon!\nI hereby vow!\nYou will rue this day!\nBehold, a true Cambrian warrior!\nYour fears made flesh!§!\n"
 WLS_last_stand_of_the_celts: "Last stand of the Celts"